<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's Cakes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav>
        <h2>🎂 Patrick's Cakes</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Cakes</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h1>Fresh Cakes for Every Celebration</h1>
    <p>Birthdays • Weddings • Anniversaries • Surprise Packages</p>
    <button>Order on WhatsApp</button>
</section>
<section class="gallery">

    <div class="cards">
        <div class="card">
            <img src="images/chocolate.jpg" alt="Chocolate Cake">
            <h3>Chocolate Cake</h3>
            <p>₦15,000</p>
        </div>

        <div class="card">
            <img src="images/wedding.jpg" alt="Wedding Cake">
            <h3>Wedding Cake</h3>
            <p>₦80,000</p>
        </div>

        <div class="card">
            <img src="images/birthday.jpg" alt="Birthday Cake">
            <h3>Birthday Cake</h3>
            <p>₦20,000</p>
        </div>
    </div>
</section>

</html>
